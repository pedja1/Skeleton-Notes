name: Pull Request Checks

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    name: Verify PR (Lint, Build, Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint (Android lint, dependency check, ktlint, detekt)
        run: ./gradlew lint checkDependencyAllowlist ktlintCheck detekt

      - name: Build
        run: ./gradlew assemble

      - name: Verify APK size
        run: ./gradlew checkApkSize

      - name: Run unit tests
        run: ./gradlew test

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          script: ./gradlew connectedAndroidTest

      - name: Run JaCoCo coverage report and verification
        run: ./gradlew jacocoFullReport jacocoFullCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: "build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml"
