name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Build & Release Nightly
    runs-on: linux_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: check
        run: |
          HEAD=$(git rev-parse HEAD)

          RELEASE_COMMITS=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r '.[].target_commitish')

          if echo "$RELEASE_COMMITS" | grep -q "^${HEAD}$"; then
            echo "HEAD (${HEAD}) already has a release, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release for HEAD (${HEAD}), proceeding with build"
          fi

      - name: Cache Gradle
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute version
        if: steps.check.outputs.skip != 'true'
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d%H%M')
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_NAME=${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "versionName=${TIMESTAMP}, versionCode=${VERSION_CODE}"

      - name: Decode keystore
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed release APK
        if: steps.check.outputs.skip != 'true'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK
        if: steps.check.outputs.skip != 'true'
        run: ./gradlew assembleDebug

      - name: Create Gitea Nightly Release
        if: steps.check.outputs.skip != 'true'
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "Nightly version: ${VERSION_NAME}"

          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Release APK: ${RELEASE_APK}"
          echo "Debug APK: ${DEBUG_APK}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${VERSION_NAME}\", \"name\": \"Nightly ${VERSION_NAME}\", \"body\": \"Nightly build\", \"prerelease\": true, \"target_commitish\": \"${HEAD}\"}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release: $RESPONSE"
            exit 1
          fi

          echo "Created nightly release ${RELEASE_ID}"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${RELEASE_APK}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename ${RELEASE_APK})"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${DEBUG_APK}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename ${DEBUG_APK})"

          echo "Upload complete"

      - name: Stop Gradle daemon
        if: always() && steps.check.outputs.skip != 'true'
        run: ./gradlew --stop
