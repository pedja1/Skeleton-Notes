name: Pull Request Checks

on:
  pull_request:
    branches: [main]

env:
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        run: |
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-36

      - name: Set up Android SDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/
            mv /tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run lint
        run: ./gradlew --no-daemon lint check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        run: |
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-36

      - name: Set up Android SDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/
            mv /tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        run: |
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-36

      - name: Set up Android SDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/
            mv /tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew --no-daemon test

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        run: |
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-emulator-${{ runner.os }}-36

      - name: Set up Android SDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/
            mv /tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd -n test -k "system-images;android-36;google_apis;x86_64" -f

      - name: Start emulator
        run: |
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 &
          "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device
          while [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
            sleep 2
          done
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell input keyevent 82
          sleep 5

      - name: Run instrumented tests
        run: ./gradlew --no-daemon connectedAndroidTest

      - name: Stop emulator
        if: always()
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" emu kill || true
