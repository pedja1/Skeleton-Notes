name: Pull Request Checks

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    name: Verify PR (Lint, Build, Tests)
    runs-on: linux_amd64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run lint
        run: ./gradlew lint checkDependencyAllowlist

      - name: Build
        run: ./gradlew assemble

      - name: Verify APK size
        run: ./gradlew checkApkSize

      - name: Run unit tests
        run: ./gradlew test

      - name: Install system image
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "system-images;android-36;default;x86_64"

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd -n test -k "system-images;android-36;default;x86_64" -f

      - name: Start emulator
        run: |
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 < /dev/null > /tmp/emulator.log 2>&1 &
          "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device
          while [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
            sleep 2
          done
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell input keyevent 82
          sleep 5

      - name: Run instrumented tests
        run: ./gradlew connectedAndroidTest

      - name: Stop emulator
        if: always()
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" emu kill || true

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
