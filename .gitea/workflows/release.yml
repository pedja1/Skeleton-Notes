name: Release

on:
  push:
    tags:
      - '*'
      - '!nightly-*'

jobs:
  release:
    name: Build & Release
    runs-on: linux_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 'versionName *=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode *=' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          # Accept the exact version tag (1.0.0) or a pre-release tag (1.0.0_pre1, 1.0.0_pre2, ...).
          case "${GITHUB_REF_NAME}" in
            "${VERSION_NAME}"|"${VERSION_NAME}"_pre[0-9]*) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${VERSION_NAME} (expected ${VERSION_NAME} or ${VERSION_NAME}_preN) in app/build.gradle.kts" >&2
              exit 1
              ;;
          esac
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Gitea Release
        run: |
          set -euo pipefail
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Release APK: ${RELEASE_APK}"
          echo "Uploading for tag ${GITHUB_REF_NAME}"
          HEAD=$(git rev-parse "${GITHUB_REF_NAME}^{}")

          case "${GITHUB_REF_NAME}" in
            *_pre[0-9]*) IS_PRERELEASE=true ;;
            *)           IS_PRERELEASE=false ;;
          esac

          # Exclude both nightly tag formats: prefixed (nightly-*) and the legacy
          # bare 12-digit timestamps (YYYYMMDDHHMM) from before the prefix migration.
          NIGHTLY_EXCLUDE="--exclude=nightly-* --exclude=[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]"

          # Most recent relevant tag before this one (empty on first release):
          #   pre-release -> last non-nightly tag (may be an earlier pre-release)
          #   stable      -> last stable tag (also skip pre-releases)
          if [ "$IS_PRERELEASE" = "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 $NIGHTLY_EXCLUDE "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 $NIGHTLY_EXCLUDE --exclude='*_pre[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          fi
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          echo "Changelog range: ${RANGE}"

          CHANGELOG=$(git log --no-merges --pretty=format:'- %s' "$RANGE")
          [ -z "$CHANGELOG" ] && CHANGELOG="- No changes"

          BODY="## Changes"$'\n\n'"${CHANGELOG}"
          if [ -n "$PREV_TAG" ]; then
            BODY="${BODY}"$'\n\n'"**Full changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          fi

          PAYLOAD=$(jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg name "${GITHUB_REF_NAME}" \
            --arg body "${BODY}" \
            --arg target "${HEAD}" \
            --argjson prerelease "${IS_PRERELEASE}" \
            '{tag_name: $tag, name: $name, body: $body, target_commitish: $target, prerelease: $prerelease}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release: $RESPONSE"
            exit 1
          fi

          echo "Created release ${RELEASE_ID}"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${RELEASE_APK}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=Skeleton-Notes-${VERSION_NAME}.apk"

          echo "Upload complete"

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
