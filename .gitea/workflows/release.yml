name: Release

on:
  push:
    tags:
      - '*'
      - '!nightly-*'

jobs:
  release:
    name: Build & Release
    runs-on: linux_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Debug CI variables
        run: |
          echo "=== Debug: GIT/REF Variables ==="
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_REF_TYPE: ${GITHUB_REF_TYPE}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_SERVER_URL: ${GITHUB_SERVER_URL}"
          echo "GITHUB_API_URL: ${GITHUB_API_URL}"
          echo ""
          echo "=== Debug: Prerelease detection ==="
          case "${GITHUB_REF_NAME}" in
            *_pre[0-9]*)
              echo "Pre-release tag detected (matches *_pre[0-9]*)"
              IS_PRERELEASE=true
              ;;
            *)
              echo "Regular release tag"
              IS_PRERELEASE=false
              ;;
          esac
          echo "IS_PRERELEASE: ${IS_PRERELEASE}"
          echo "=== Debug: JSON payload preview ==="
          echo "{\"tag_name\": \"${GITHUB_REF_NAME}\", \"name\": \"${GITHUB_REF_NAME}\", \"body\": \"Release ${GITHUB_REF_NAME}\", \"prerelease\": ${IS_PRERELEASE}}"
          echo ""
          echo "=== Debug: Check if tag is non-empty ==="
          if [ -z "${GITHUB_REF_NAME}" ]; then
            echo "WARNING: GITHUB_REF_NAME is EMPTY!"
          else
            echo "GITHUB_REF_NAME is non-empty: [${GITHUB_REF_NAME}]"
          fi

      - name: Create Gitea Release
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Release APK: ${RELEASE_APK}"
          echo "Debug APK: ${DEBUG_APK}"
          echo "Uploading for tag ${GITHUB_REF_NAME}"
          HEAD=$(git rev-parse "${GITHUB_REF_NAME}^{}")

          case "${GITHUB_REF_NAME}" in
            *_pre[0-9]*)
              PRERELEASE_JSON=', "prerelease": true'
              ;;
            *)
              PRERELEASE_JSON=''
              ;;
          esac

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${GITHUB_REF_NAME}\", \"name\": \"${GITHUB_REF_NAME}\", \"body\": \"Release ${GITHUB_REF_NAME}\", \"target_commitish\": \"${HEAD}\"${PRERELEASE_JSON}}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release: $RESPONSE"
            exit 1
          fi

          echo "Created release ${RELEASE_ID}"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${RELEASE_APK}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename ${RELEASE_APK})"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${DEBUG_APK}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename ${DEBUG_APK})"

          echo "Upload complete"

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
